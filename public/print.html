<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Impressão de Contratos</title>
  <link rel="shortcut icon" href="files/ico.svg" type="image/x-icon">

  <style>
    .print-page {
      font-family: Arial, sans-serif;
      padding: 20px;
      color: #000;
    }

    .registro {
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 2px dashed #000;
      page-break-inside: avoid;
    }

    .titulo {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .linha {
      margin: 2px 0;
    }

    .subtitulo {
      margin-top: 15px;
      font-weight: bold;
    }

    .materia {
      margin-left: 20px;
      margin-top: 10px;
    }

    .detalhes {
      margin-left: 20px;
      margin-top: 10px;
    }

    @media print {
      body {
        padding: 0;
      }

      .registro {
        border-bottom: 1px solid #000;
      }
    }
  </style>
</head>

<body>

  <div id="conteudo"></div>

  <script>
    const dados = localStorage.getItem("print-dados") ? JSON.parse(localStorage.getItem("print-dados")) : [];

    console.log(dados);

    const container = document.getElementById("conteudo");

    dados.forEach(registro => {

      const div = document.createElement("div");
      div.className = "registro";
      Object.keys(registro).forEach(key => {
        const linha = document.createElement("div");
        linha.className = "linha";
        linha.innerHTML = `<b>${key}:</b> ${registro[key]}`;
        div.appendChild(linha);
      });
      container.appendChild(div);
    });


    // Abre automaticamente a janela de impressão
    window.onload = () => {
      window.print();
    };

  </script>

</body>

</html>
